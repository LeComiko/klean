name: CI

on:
  push:
  pull_request:
  # La publication d'une version (publication.yml) rejoue tout ce CI avant de
  # construire quoi que ce soit.
  workflow_call:

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: klean
          POSTGRES_PASSWORD: klean
          POSTGRES_DB: klean_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # La fabrique de test lit cette variable. Sans elle, elle déduirait le nom
      # d'utilisateur du poste, ce qui n'a pas de sens sur un exécuteur.
      KLEAN_TEST_CONNECTION: "Host=localhost;Port=5432;Database=klean_test;Username=klean;Password=klean"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer
        run: dotnet restore

      - name: Construire
        run: dotnet build --no-restore

      - name: Tester
        run: dotnet test --no-build --verbosity normal

  frontend:
    name: Frontend — build et linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 au minimum : c'est la première version qui dépouille les types
          # TypeScript sans drapeau, ce dont dépendent les séries frontend. Le
          # jalon « 22 » résout toujours vers la dernière 22.x, donc au-dessus.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer
        run: npm ci
        working-directory: frontend

      - name: Linter
        run: npm run lint
        working-directory: frontend

      - name: Vérifier le système d'interface
        run: npm run verifier
        working-directory: frontend

      # ⚠️ Cet exécuteur tourne en UTC. Les deux pièges de date de CLAUDE.md §10
      # sont symétriques et AUCUN des deux ne se voit sous TZ=UTC : c'est le
      # lanceur qui rejoue la série des dates dans cinq fuseaux. Ne pas remplacer
      # cette commande par un « node --test » direct.
      - name: Tester
        run: npm test
        working-directory: frontend

      - name: Construire
        run: npm run build
        working-directory: frontend

  # Les deux images de docker-compose.yml. Sans ce travail, un Dockerfile cesse de
  # construire le jour où le projet change — une version du SDK, un fichier
  # déplacé — et l'exploitant le découvre en mettant à jour, pas nous en
  # poussant.
  images:
    name: Images — construction
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: API et bundle de migration
        run: docker build -t klean-api:ci ./backend

      - name: Caddy, document et en-têtes
        run: docker build -t klean-caddy:ci ./frontend

  # Le script d'installation et ses fonctions. La série tourne sur l'exécuteur, en
  # bash 5 et GNU tar comme les serveurs visés ; shellcheck y est préinstallé.
  deploiement:
    name: Déploiement — shellcheck, série, compose publié
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x deploiement/installer.sh deploiement/klean deploiement/fonctions.sh deploiement/publier.sh deploiement/tests/tests.sh deploiement/tests/lancer.sh deploiement/tests/commande.sh

      - name: Série
        run: bash deploiement/tests/tests.sh

      # Les gestes de `klean` autour du code d'installation, compose et psql simulés.
      - name: Commande
        run: bash deploiement/tests/commande.sh

      # Le compose qu'un serveur reçoit n'a plus de build: ; il doit rester lisible
      # par docker compose, et désigner les images de la version. Et il passe le code
      # d'installation à l'API sous son nom : KLEAN_CODE_INSTALLATION et Installation__Code
      # sont un contrat entre une version et la suivante (deploiement/klean).
      #
      # Le code est tiré ici, jamais écrit dans le dépôt, d'une façon robuste même sous
      # pipefail : `cut` lit tout, alors qu'un `head -c 20` fermerait le tube avant la fin,
      # et `tr` sortirait en erreur sur SIGPIPE.
      - name: Le compose d'une version publiée est valide
        run: |
          deploiement/publier.sh 0.0.0 essai/klean "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/version"
          tar xzf "$RUNNER_TEMP/dist/klean-0.0.0.tar.gz" -C "$RUNNER_TEMP/version"
          code=$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'ABCDEFGHJKMNPQRSTUVWXYZ23456789' | cut -c 1-20)
          [[ $code =~ ^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{20}$ ]]
          printf 'KLEAN_DOMAINE=exemple.fr\nPOSTGRES_PASSWORD=x\nKLEAN_JWT_CLE=y\nKLEAN_IMAGES=ghcr.io/essai/klean\nKLEAN_VERSION=0.0.0\nKLEAN_CODE_INSTALLATION=%s\n' "$code" > "$RUNNER_TEMP/version/.env"
          docker compose --project-directory "$RUNNER_TEMP/version" -f "$RUNNER_TEMP/version/docker-compose.yml" config -q
          docker compose --project-directory "$RUNNER_TEMP/version" -f "$RUNNER_TEMP/version/docker-compose.yml" config --format json |
            jq -er '.services.api.environment.Installation__Code' | grep -qx "$code"
          docker compose --project-directory "$RUNNER_TEMP/version" -f "$RUNNER_TEMP/version/docker-compose.yml" config --images | sort -u > "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"
          grep -qx 'ghcr.io/essai/klean-api:0.0.0' "$RUNNER_TEMP/images.txt"
          grep -qx 'ghcr.io/essai/klean-caddy:0.0.0' "$RUNNER_TEMP/images.txt"

      # Les réseaux, un contrat entre une version et la suivante (deploiement/klean) :
      # le réseau `klean` ne change jamais de configuration, sans quoi le `compose run
      # migrer` d'une mise à jour échoue, Caddy y étant branché ; Caddy seul rejoint
      # `public`, et `migrer` jamais. Le profil `outils` fait paraître `migrer`.
      - name: Les réseaux du compose publié
        run: |
          docker compose --project-directory "$RUNNER_TEMP/version" -f "$RUNNER_TEMP/version/docker-compose.yml" --profile outils config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '.networks.klean | has("enable_ipv6") | not' "$RUNNER_TEMP/compose.json"
          jq -e '.networks.klean.ipam.config == [{"subnet": "172.28.0.0/24"}]' "$RUNNER_TEMP/compose.json"
          # Le réseau entier, et non deux de ses clés : une option ajoutée suffit à le faire recréer.
          jq -e '.networks.klean | del(.name) == {"ipam": {"config": [{"subnet": "172.28.0.0/24"}]}}' "$RUNNER_TEMP/compose.json"
          jq -e '.services.caddy.networks | keys == ["klean", "public"]' "$RUNNER_TEMP/compose.json"
          jq -e '.services.caddy.networks.klean.ipv4_address == "172.28.0.10"' "$RUNNER_TEMP/compose.json"
          jq -e '.services.api.networks | keys == ["klean"]' "$RUNNER_TEMP/compose.json"
          jq -e '.services.migrer.networks | keys == ["klean"]' "$RUNNER_TEMP/compose.json"
          jq -e '.services.postgres.networks | keys == ["klean"]' "$RUNNER_TEMP/compose.json"
          # gw_priority exige Compose 2.33+ : le plugin d'un serveur en 0.2.0 ne le lirait pas.
          jq -e '[.services[].networks // {} | .[] | objects | has("gw_priority")] | any | not' "$RUNNER_TEMP/compose.json"
