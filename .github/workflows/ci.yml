name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: klean
          POSTGRES_PASSWORD: klean
          POSTGRES_DB: klean_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # La fabrique de test lit cette variable. Sans elle, elle déduirait le nom
      # d'utilisateur du poste, ce qui n'a pas de sens sur un exécuteur.
      KLEAN_TEST_CONNECTION: "Host=localhost;Port=5432;Database=klean_test;Username=klean;Password=klean"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer
        run: dotnet restore

      - name: Construire
        run: dotnet build --no-restore

      - name: Tester
        run: dotnet test --no-build --verbosity normal

  frontend:
    name: Frontend — build et linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 au minimum : c'est la première version qui dépouille les types
          # TypeScript sans drapeau, ce dont dépendent les séries frontend. Le
          # jalon « 22 » résout toujours vers la dernière 22.x, donc au-dessus.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer
        run: npm ci
        working-directory: frontend

      - name: Linter
        run: npm run lint
        working-directory: frontend

      - name: Vérifier le système d'interface
        run: npm run verifier
        working-directory: frontend

      # ⚠️ Cet exécuteur tourne en UTC. Les deux pièges de date de CLAUDE.md §10
      # sont symétriques et AUCUN des deux ne se voit sous TZ=UTC : c'est le
      # lanceur qui rejoue la série des dates dans cinq fuseaux. Ne pas remplacer
      # cette commande par un « node --test » direct.
      - name: Tester
        run: npm test
        working-directory: frontend

      - name: Construire
        run: npm run build
        working-directory: frontend
