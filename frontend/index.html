    <!--
      ⚠️ AUCUNE ressource externe ici, et aucune à ajouter.

      Figtree et IBM Plex Mono (CLAUDE.md §12) étaient chargées depuis Google
      jusqu'au 3 octobre 2026, ce qui transmettait l'adresse IP de chaque visiteur
      de chaque instance à un tiers (RGPD.md §9.1). Elles sont désormais servies par
      KLEAN : fichiers dans `public/polices/`, déclarations `@font-face` en tête de
      `src/styles/tokens.css`.

      Conséquence sur la politique de sécurité du contenu : `frontend/csp.ts` ne
      déclare plus AUCUNE origine externe, en production comme en développement.
      Ajouter une ressource distante ici demanderait de rouvrir cette politique, et
      ce serait une régression de conformité avant d'être une question technique —
      le défaut ne se verrait d'ailleurs pas au développement, dont la politique est
      plus permissive et dont le cache masque une police manquante.
    -->

    <title>KLEAN</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
